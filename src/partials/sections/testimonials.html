<section class="testimonials" id="testimonials">
  <div class="container">
    <div class="section-head anim-on-scroll">
      <h2 class="section-head__title">@@testimonials_title</h2>
      <p class="section-head__text">@@testimonials_text</p>
    </div>
    <div class="testimonials__grid">
      @@for (var i = 0; i < testimonials.length; i++) {
      <div class="testimonials__card anim-on-scroll">
        <div class="testimonials__stars">★★★★★</div>
        <p class="testimonials__text">
          "`+testimonials[i].text+`"
        </p>
        <div class="testimonials__author">
          <div class="testimonials__avatar">`+testimonials[i].initials+`</div>
          <div>
            <span class="testimonials__name">`+testimonials[i].name+`</span>
            <span class="testimonials__info">`+testimonials[i].info+`</span>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
