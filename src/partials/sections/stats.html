<div class="stats" id="stats">
  <div class="container">
    <div class="stats__grid">
      @@for (var i = 0; i < stats.length; i++) {
      <div class="stats__item anim-on-scroll">
        <div class="stats__number" data-count="`+stats[i].count+`">0</div>
        <div class="stats__label">`+stats[i].label+`</div>
      </div>
      }
    </div>
  </div>
</div>
