<section class="about" id="about">
  <div class="container">
    <div class="about__grid">
      <div class="about__content anim-on-scroll" data-anim="fade-left">
        <h2 class="about__title">@@about_title</h2>
        <div class="about__text">
          @@about_text
        </div>
        <ul class="about__list">
          <li class="anim-on-scroll" data-anim="fade-left">
            Certified RMT professional
          </li>
          <li class="anim-on-scroll" data-anim="fade-left">
            Calm, serene treatment space
          </li>
          <li class="anim-on-scroll" data-anim="fade-left">
            Personalized care for every client
          </li>
          <li class="anim-on-scroll" data-anim="fade-left">
            Insurance receipts provided
          </li>
          <li class="anim-on-scroll" data-anim="fade-left">
            Premium organic products
          </li>
          <li class="anim-on-scroll" data-anim="fade-left">
            Private, sanitized room
          </li>
        </ul>
      </div>
      <div class="about__image anim-on-scroll" data-anim="fade-right" data-delay="0">
        <img src="./img/hero.webp" alt="Our Spa Interior" width="800" height="600" loading="lazy">
      </div>
    </div>
  </div>
</section>
