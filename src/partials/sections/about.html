<section class="about" id="about">
  <div class="container">
    <div class="about__grid">
      <div class="about__content anim-on-scroll">
        <h2 class="about__title">@@about_title</h2>
        <div class="about__text">
          @@about_text
        </div>
        <ul class="about__list">
          <li class="anim-on-scroll">
            Certified RMT professional
          </li>
          <li class="anim-on-scroll">
            Calm, serene treatment space
          </li>
          <li class="anim-on-scroll">
            Personalized care for every client
          </li>
          <li class="anim-on-scroll">
            Insurance receipts provided
          </li>
          <li class="anim-on-scroll">
            Premium organic products
          </li>
          <li class="anim-on-scroll">
            Private, sanitized room
          </li>
        </ul>
      </div>
      <div class="about__image img-wrap anim-on-scroll" data-delay="0">
        <img src="./img/hero.webp" alt="Our Spa Interior" width="800" height="600">
      </div>
    </div>
  </div>
</section>
