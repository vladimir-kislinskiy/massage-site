<section class="services" id="services" data-stagger="50">
	<div class="container">
		<div class="section-head anim-on-scroll">
			<h2 class="section-head__title">@@services_title</h2>
			<p class="section-head__text">@@services_text</p>
		</div>
		<div class="services__grid">
			@@for (var i = 0; i < services.length; i++) {
			<div class="services__card anim-on-scroll" data-service-img="`+services[i].image+`" data-service-title="`+services[i].title+`" data-service-desc="`+services[i].description+`" id="service-`+i+`">
				<div class="services__card-inner">
					<div class="services__card-front">
						<div class="services__card-img img-wrap">
							<img src="`+services[i].image+`" alt="`+services[i].title+`">
						</div>
						<div class="services__card-footer">
							<h3>`+services[i].title+`</h3>
						</div>
					</div>
					<div class="services__card-back" style="background-image: url('`+services[i].image+`');">
						<div class="services__card-back-content">
							<h3>`+services[i].title+`</h3>
							<p>`+services[i].description+`</p>
						</div>
					</div>
				</div>
			</div>
			}
		</div>
	</div>

	<!-- Service Modal -->
	<div class="service-modal" id="serviceModal">
		<div class="service-modal__overlay" id="serviceModalOverlay"></div>
		<div class="service-modal__window">
			<button class="service-modal__close" id="serviceModalClose"></button>
			<div class="service-modal__img">
				<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Service" id="serviceModalImg">
			</div>
			<div class="service-modal__body">
				<h3 id="serviceModalTitle">&nbsp;</h3>
				<p id="serviceModalDesc">&nbsp;</p>
			</div>
		</div>
	</div>
</section>
